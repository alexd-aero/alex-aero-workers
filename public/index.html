<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex-Aero</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22%23ecdcbf%22/%3E%3Cpath%20fill%3D%22%231b1915%22%20d%3D%22M15.2%205.4%20L15.2%2020.7%20L4.6%2026.2%20Z%22/%3E%3Cpath%20fill%3D%22%231b1915%22%20fill-opacity%3D%22.5%22%20d%3D%22M16.8%205.4%20L27.4%2026.2%20L16.8%2020.7%20Z%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Geist+Mono:wght@400..600&display=swap" />
  <link rel="stylesheet" href="/styles.css?v=2.2.1" />
  <script>
    // theme before first paint: saved choice, else the system's
    (function () {
      var t = null;
      try { t = localStorage.getItem('ax-theme'); } catch (_) {}
      var q = (location.search.match(/[?&]theme=(light|dark)/) || [])[1];
      if (q) { t = q; try { localStorage.setItem('ax-theme', q); } catch (_) {} }
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="side" id="side" aria-label="Main navigation">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="tile" width="32" height="32" rx="9"/><path class="glyph" d="M15.2 5.4 L15.2 20.7 L4.6 26.2 Z" stroke-linejoin="round"/><path class="glyph shade" d="M16.8 5.4 L27.4 26.2 L16.8 20.7 Z" stroke-linejoin="round"/></svg>
        <span class="brand-name">Alex<em>·</em>Aero<span class="brand-sub">Workers on your own box</span></span>
      </a>
      <nav id="nav"></nav>
      <div class="nav-label">Workers</div>
      <div id="navWorkers"></div>
      <div class="side-foot">
        <div class="host" title="Where this dashboard is served from"><span class="dot"></span><b id="hostLabel">…</b></div>
        <div class="row" style="gap:4px">
          <button class="btn ghost sm grow" id="paletteBtn" type="button" title="Command palette" style="justify-content:space-between">Search <span class="kbd">Ctrl K</span></button>
          <button class="icon-btn" id="themeBtn" type="button" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
          <button class="icon-btn" id="signOutBtn" type="button" title="Sign out" aria-label="Sign out"></button>
        </div>
      </div>
    </aside>
    <div class="scrim hidden" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open navigation"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-actions" id="topActions"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="/lang-icons.js?v=2.2.1"></script>
  <script src="/app.js?v=2.2.1"></script>
</body>
</html>
